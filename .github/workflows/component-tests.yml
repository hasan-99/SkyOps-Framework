name: SkyOps component compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out the private working tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.5'
      - name: Characterization and state regression contracts
        run: node --test tests/baseline/characterization.test.cjs tests/baseline/state-and-evidence.test.cjs
      - name: Packaging, licensing, privacy and transport components
        run: node scripts/verify-packaging.cjs
      - name: Local report and Git workflow regression
        run: node --test tests/integration/report-hygiene.test.cjs

# No publishing, production credentials, source-repository tokens for end users,
# native model calls or hosted Supabase resource mutations occur in this job.
# Job success does not certify WSL, native host, cloud/RLS or full E2E parity.
